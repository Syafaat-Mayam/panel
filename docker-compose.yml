version: '3.8'

# Common environment variables for Codespaces
x-common:
  database:
    &db-environment
    MYSQL_PASSWORD: &db-password "pterodactyl_pass_2026"
    MYSQL_ROOT_PASSWORD: "root_pass_2026"
    MYSQL_DATABASE: "panel"
    MYSQL_USER: "pterodactyl"
  
  panel:
    &panel-environment
    # Codespaces URL - Important: This must match your forwarded port URL
    APP_URL: "https://${CODESPACE_NAME}-80.${GITHUB_CODESPACES_PORT_FORWARDING_DOMAIN}"
    APP_TIMEZONE: "UTC"
    APP_SERVICE_AUTHOR: "noreply@localhost"
    TRUSTED_PROXIES: "*"
    # For Codespaces, we'll use HTTP for simplicity
    # LE_EMAIL: "admin@example.com"
  
  mail:
    &mail-environment
    MAIL_FROM: "noreply@localhost"
    MAIL_DRIVER: "log"  # Use log driver for Codespaces
    MAIL_HOST: "localhost"
    MAIL_PORT: "1025"
    MAIL_USERNAME: ""
    MAIL_PASSWORD: ""
    MAIL_ENCRYPTION: "null"

services:
  # Database Service
  database:
    image: mariadb:10.11
    restart: unless-stopped
    command: --default-authentication-plugin=mysql_native_password
    volumes:
      - "db_data:/var/lib/mysql"
    environment:
      <<: *db-environment
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - pterodactyl_network

  # Cache Service
  cache:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --save 60 1 --loglevel warning
    volumes:
      - "cache_data:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      timeout: 20s
      retries: 10
    networks:
      - pterodactyl_network

  # Panel Service - Fixed for Codespaces
  panel:
    image: ghcr.io/pterodactyl/panel:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      database:
        condition: service_healthy
      cache:
        condition: service_healthy
    volumes:
      - "panel_data:/app/var/"
      - "nginx_config:/etc/nginx/http.d/"
      - "ssl_certs:/etc/letsencrypt/"
      - "panel_logs:/app/storage/logs"
    environment:
      <<: [*panel-environment, *mail-environment]
      DB_PASSWORD: *db-password
      APP_ENV: "local"
      APP_ENVIRONMENT_ONLY: "false"
      APP_DEBUG: "true"  # Enable for debugging in Codespaces
      APP_LOG_LEVEL: "debug"
      CACHE_DRIVER: "redis"
      SESSION_DRIVER: "redis"
      QUEUE_DRIVER: "redis"
      REDIS_HOST: "cache"
      REDIS_PORT: 6379
      DB_HOST: "database"
      DB_PORT: 3306
      # Codespaces specific
      TRUSTED_PROXIES: "*"
    networks:
      - pterodactyl_network

# Volumes
volumes:
  db_data:
  cache_data:
  panel_data:
  nginx_config:
  ssl_certs:
  panel_logs:

# Network
networks:
  pterodactyl_network:
    driver: bridge
